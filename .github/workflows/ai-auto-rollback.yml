name: AI Auto Rollback Demo

on:
  push:
    branches:
      - main

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker images
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Building v2 (Healthy) image..."
          git checkout v2
          docker build -t ai-auto-rollback-web:v2 .
          
          echo "Building v3 (Degraded) image..."
          git checkout $CURRENT_COMMIT
          docker build -t ai-auto-rollback-web:v3 .

      - name: Deploy Degraded v3
        run: |
          export APP_VERSION=v3
          # Starting prometheus and grafana explicitly just in case they aren't default
          docker compose up -d --no-build --force-recreate web prometheus grafana
          
          echo "Waiting for web service to become healthy..."
          sleep 5
          curl -f http://localhost:5000/health || exit 1
          echo "Deployed Version: $(curl -s http://localhost:5000/health | jq -r .version)"

      - name: Generate Traffic
        run: |
          echo "Starting load generation to populate Prometheus metrics..."
          locust --headless -u 10 -r 2 -t 15s --host http://localhost:5000 &
          echo "Simulating traffic and waiting 15 seconds for metrics to accumulate..."
          sleep 15

      - name: Run AI Analyzer
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          echo "=========================================="
          echo "AI DEVOPS AUTOMATIC ROLLBACK"
          echo "=========================================="
          python ai_analyzer.py

      - name: Verify Final State
        run: |
          echo "=========================================="
          echo "VERIFYING ROLLBACK SUCCESS"
          echo "=========================================="
          VERSION=$(curl -s http://localhost:5000/health | jq -r .version)
          echo "Current Version: $VERSION"
          
          LATENCY=$(curl -s -w "%{time_total}\n" -o /dev/null http://localhost:5000/api/data)
          echo "Current /api/data latency: $LATENCY seconds"
          
          if [ "$VERSION" != "v2" ]; then
              echo "❌ DEMO FAILED: Application is still running $VERSION."
              exit 1
          fi
          
          echo "✅ DEMO SUCCESS: Automatically rolled back to a healthy state!"
          echo "DEPLOYMENT RECOVERED"
          echo "=========================================="
